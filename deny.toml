# cargo-deny config for keel
# Use the bans/licenses/sources subset — skip advisories to avoid CVSS4 breakage
# (self_cargo_deny_cvss4_breakage discipline)

[graph]
targets = []

[advisories]
# Skip advisories gate — see self_cargo_deny_cvss4_breakage memory note
# Use `cargo deny check bans licenses sources` instead of `cargo deny check`
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
